<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vehicle flight lab / 驾驶沙盒</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lab.css"><link rel="stylesheet" href="site-nav.css"><link rel="stylesheet" href="driving.css?v=20261022-jump-final"></head><body class="drive-page"><header class="site-header"><a class="site-brand" href="index.html">V<span>／</span>VEHICLE FLIGHT LAB</a><nav class="site-main-nav" aria-label="主导航"><a href="index.html" aria-current="page">驾驶沙盒</a><a href="../README.md" target="_blank">说明与算法</a><a href="credits.html" target="_blank">来源与许可</a></nav></header>
<main class="driving-game"><div class="drive-viewport" id="drive-viewport">
<div id="drive-world" class="world" aria-label="车辆驾驶沙盒"></div><div id="drive-load" role="status">载入车辆…</div>
<div class="game-top"><div class="assist-badge"><span class="status-dot"></span><span><b id="mode-label">喷气辅助</b><small id="assist-state">已开启 · 待命</small></span></div><div class="view-buttons" role="group" aria-label="驾驶视角"><button data-view="chase" aria-pressed="true">第三人称</button><button data-view="driver" aria-pressed="false">驾驶位</button><button id="recenter" aria-label="车辆复位">复位</button><button id="fullscreen" aria-label="进入全屏" aria-pressed="false"><span aria-hidden="true">⛶</span> <span id="full-label">全屏</span></button></div></div>
<div class="drive-settings"><div class="mode-buttons" role="group" aria-label="姿态喷气辅助"><span>喷气辅助</span><button data-assist="true" aria-pressed="true" aria-label="开启姿态喷气辅助">开</button><button data-assist="false" aria-pressed="false" aria-label="关闭姿态喷气辅助">关</button></div><button id="downforce" aria-pressed="false">吸地风扇 <b id="downforce-state">关</b><small id="downforce-output">已关闭</small></button><button id="sound" aria-pressed="true" aria-label="关闭车辆声音">声音 <b id="sound-state">开</b></button></div>
<div id="drive-state" class="action-status" role="status" hidden></div>
<section class="drive-readout" aria-label="车速与挡位"><strong id="drive-speed">0</strong><div><span>km/h</span><b id="drive-gear">D</b></div></section>
<section class="hud-gas" id="hud-gas" data-phase="ready" aria-label="剩余气量"><div class="gas-heading"><a href="../docs/validation.md" target="_blank" rel="noopener" aria-label="查看喷气验证记录">气量 ↗</a><strong id="gas-percent">100%</strong></div><div class="fuel-track"><div id="gas-fill"></div></div><small id="gas-state">气量充足</small></section>
<div class="game-bottom"><div class="drive-keyboard" aria-label="键盘控制"><span><kbd>W</kbd><kbd>S</kbd> 油门 / 倒车</span><span><kbd>A</kbd><kbd>D</kbd> 转向</span><span><kbd>SPACE</kbd> 刹车</span><span><kbd>R</kbd> 复位</span><span><kbd>F</kbd> 全屏</span></div><div class="steering-buttons touch-only"><button data-key="KeyA" aria-label="向左转">←</button><button data-key="KeyD" aria-label="向右转">→</button></div><button id="kick" disabled><span id="kick-label">KICKFLIP</span><kbd>K</kbd></button><div class="pedal-buttons touch-only"><button data-key="Space" aria-label="刹车">刹车</button><button data-key="KeyS" aria-label="倒车">↓</button><button data-key="KeyW" aria-label="加速">↑</button></div></div>
</div></main><script type="module" src="driving.mjs?v=20261022-jump-final"></script></body></html>
